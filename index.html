<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>Inventory & Expiration Management System</title>
</head>

<body>

  <h1>Inventory & Expiration Management System</h1>

  <div id="resumo">
    <p>Total: <span id="total">0</span></p>
    <p>Vencidos: <span id="vencidos">0</span></p>
    <p>Em atenção: <span id="atencao">0</span></p>
    <p>Normais: <span id="normais">0</span></p>
  </div>

  <input
    type="text"
    id="busca"
    placeholder="Buscar item..."
    oninput="filtrarItens()"
  >

  <table border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Item</th>
        <th>Quantidade</th>
        <th>Vencimento</th>
        <th>Dias restantes</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="listaItens"></tbody>
  </table>

  <script>
    let itens = [];

    function carregarDashboard() {
      google.script.run
        .withSuccessHandler(dados => {
          itens = dados.itens;

          document.getElementById("total").textContent =
            dados.relatorio.total;

          document.getElementById("vencidos").textContent =
            dados.relatorio.vencidos;

          document.getElementById("atencao").textContent =
            dados.relatorio.atencao;

          document.getElementById("normais").textContent =
            dados.relatorio.normais;

          exibirItens(itens);
        })
        .obterDadosDashboard();
    }

    function exibirItens(lista) {
      const tabela = document.getElementById("listaItens");

      tabela.innerHTML = "";

      lista.forEach(item => {
        const linha = document.createElement("tr");

        linha.innerHTML = `
          <td>${item.id}</td>
          <td>${item.item}</td>
          <td>${item.quantidade}</td>
          <td>${item.vencimento || "-"}</td>
          <td>${item.diasRestantes ?? "-"}</td>
          <td>${item.status}</td>
        `;

        tabela.appendChild(linha);
      });
    }

    function filtrarItens() {
      const termo = document
        .getElementById("busca")
        .value
        .toLowerCase();

      const resultado = itens.filter(item =>
        String(item.item).toLowerCase().includes(termo)
      );

      exibirItens(resultado);
    }

    carregarDashboard();
  </script>

</body>
</html>
